# 每 6 天自动请求 Supabase，防止免费项目因闲置暂停
# 仓库 Secrets 需配置：
#   SUPABASE_URL   例如 https://xxxx.supabase.co
#   SUPABASE_KEY   anon public key（eyJ...）
#   SUPABASE_BUCKET  可选，默认 xshare
name: Activate Supabase

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Replace keepalive.md on Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::请配置 Secrets: SUPABASE_URL 与 SUPABASE_KEY"
            exit 1
          fi

          BASE="${SUPABASE_URL%/}"
          BUCKET="${SUPABASE_BUCKET:-xshare}"
          export TZ=Asia/Shanghai
          LINE=$(date '+%Y-%m-%d %H:%M:%S %Z')
          FILE="keepalive/ping.md"

          printf '%s\n' "$LINE" > /tmp/ping.md
          echo "替换 $BUCKET/$FILE ← $LINE"

          CODE=$(curl -sS -o /tmp/sb_up.txt -w "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: text/markdown; charset=utf-8" \
            -H "x-upsert: true" \
            --data-binary @/tmp/ping.md \
            "$BASE/storage/v1/object/${BUCKET}/${FILE}" || true)

          echo "HTTP $CODE"
          cat /tmp/sb_up.txt 2>/dev/null || true
          echo

          if [[ "$CODE" =~ ^2 ]]; then
            echo "✅ 完成"
            exit 0
          fi
          echo "::error::上传失败 HTTP $CODE"
          exit 1
